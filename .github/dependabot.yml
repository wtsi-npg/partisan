version: 2
updates:
- package-ecosystem: "pip"
  directory: "/"
  schedule:
    interval: "daily"
    time: "00:00"
    timezone: "Europe/London"
  cooldown:
    default-days: 5
    semver-major-days: 90
    semver-minor-days: 30
    semver-patch-days: 10
  open-pull-requests-limit: 5

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "daily"
    time: "00:00"
    timezone: "Europe/London"
  open-pull-requests-limit: 5
